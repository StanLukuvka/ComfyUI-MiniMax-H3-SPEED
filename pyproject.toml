[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-mini-max-h3-speed-sampler"
version = "2.0.0"
description = "MiniMax-H3 SPEED V2 progressive-resolution sampler with Automatic, Manual, and sampler-aware Harvest nodes."
readme = "README.md"
license = {text = "PolyForm Noncommercial 1.0.0"}
requires-python = ">=3.10"
# ComfyUI provides torch; numpy is the only additional direct runtime dependency.
dependencies = ["numpy"]

[tool.setuptools.packages.find]
include = ["speed_scripts*", "nodes*"]
