[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-mini-max-h3-speed-sampler"
version = "2.0.0"
description = "Progressive-resolution SPEED sampler for MiniMax-H3 video and flow image models (MOSS Image, Krea 2): Automatic, Manual and Sigma Harvest nodes in Advanced and KSampler variants."
readme = "README.md"
license = {text = "PolyForm Noncommercial 1.0.0"}
requires-python = ">=3.10"
# ComfyUI provides torch; numpy is the only additional direct runtime dependency.
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
include = ["speed_scripts*", "nodes*"]
