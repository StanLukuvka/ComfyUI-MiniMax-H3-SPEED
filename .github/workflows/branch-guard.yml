name: branch-guard

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: read

jobs:
  only-dev-to-main:
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless PR source is this repository's dev branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != "dev" ] || [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "::error::PRs to main must come from this repository's dev branch. Target dev instead."
            exit 1
          fi
